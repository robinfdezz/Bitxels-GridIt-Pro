<!DOCTYPE html>
<html lang="es" style="background-color: #222222; color: #f5f5f5;">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitGrid Pro - Generador de Mallas y Gu&iacute;as de Logotipos</title>

    <script>
        (function() {
            if (typeof window.module === "object") {
                window.nodeModule = window.module;
                window.nodeRequire = window.require;
                try { delete window.module; } catch(e) { window.module = undefined; }
            }
            window.addEventListener("error", function(evt) {
                console.error("[BitGrid Pro Error]", evt.message);
            });
        })();
    </script>

    <link rel="stylesheet" type="text/css" href="./css/styles.css">
</head>
<body style="background-color: #222222; color: #f5f5f5; margin: 0; padding: 0;">
    <div id="app" class="app-wrapper">
        
        <!-- 1. Encabezado de Marca: Logo SVG + GRID Badge -->
        <header class="brand-header">
            <div class="brand-emblem-row">
                <img src="./assets/bitxels.svg" alt="BitGrid Pro" class="brand-logo-img">
                <span class="brand-badge-grid">GRID PRO</span>
            </div>

            <!-- Sub-navegaciÃ³n horizontal: Solo Mallas estÃ¡ activa, el resto al 20% de opacidad -->
            <nav class="subnav-tabs" role="tablist">
                <button class="subnav-item active" data-nav="grids">Mallas de Logo</button>
                <button class="subnav-item disabled-feature" data-functional="false" title="Pr&oacute;ximamente">Presentaciones</button>
                <button class="subnav-item disabled-feature" data-functional="false" title="Pr&oacute;ximamente">Gu&iacute;as de Marca</button>
                <button class="subnav-item disabled-feature" data-functional="false" title="Pr&oacute;ximamente">Archivos</button>
            </nav>
        </header>

        <!-- 2. Contenedor Flotante Principal (Studio Card) -->
        <main class="studio-card">
            
            <!-- Barra Superior de la Tarjeta: Icono Azul + TÃ­tulo + Ver Tutorial (20% opacidad) -->
            <div class="card-topbar">
                <div class="card-title-group">
                    <div class="blue-icon-badge">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                        </svg>
                    </div>
                    <span class="card-title-text" id="panel-heading">Mallas de Logo</span>
                </div>

                <button class="btn-tutorial disabled-feature" data-functional="false" title="Pr&oacute;ximamente">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <span>Ver tutorial</span>
                </button>
            </div>

            <!-- 3. Control Segmentado PÃ­ldora: Base es funcional, ConstrucciÃ³n y Reserva al 20% de opacidad -->
            <div class="segmented-control">
                <button class="segment-btn active" data-segment="base" id="seg-base">Base</button>
                <button class="segment-btn disabled-feature" data-functional="false" id="seg-construction" title="Pr&oacute;ximamente">Construcci&oacute;n</button>
                <button class="segment-btn disabled-feature" data-functional="false" id="seg-clearspace" title="Pr&oacute;ximamente">&Aacute;rea de Reserva</button>
            </div>

            <!-- 4. CuadrÃ­cula de 4 Ãtems: Cuadrada, IsomÃ©trica y RazÃ³n Ãurea activas. Hexagonal al 20% -->
            <div class="quad-grid" id="view-base-quad">
                <!-- Cuadrada (Activa 100%) -->
                <button class="quad-item active" data-type="square" id="card-square">
                    <div class="quad-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="9" y1="3" x2="9" y2="21"/>
                            <line x1="15" y1="3" x2="15" y2="21"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="3" y1="15" x2="21" y2="15"/>
                        </svg>
                    </div>
                    <span class="quad-label">Cuadrada</span>
                </button>

                <!-- IsomÃ©trica (Activa 100%) -->
                <button class="quad-item" data-type="isometric" id="card-isometric">
                    <div class="quad-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                            <polyline points="2 17 12 22 22 17"/>
                            <polyline points="2 12 12 17 22 12"/>
                        </svg>
                    </div>
                    <span class="quad-label">Isom&eacute;trica</span>
                </button>

                <!-- Hexagonal (Sin funcionalidad actual -> 20% opacidad) -->
                <button class="quad-item disabled-feature" data-type="hexagon" data-functional="false" id="card-hexagon" title="Pr&oacute;ximamente">
                    <div class="quad-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2l7 4v8l-7 4-7-4V6z"/>
                        </svg>
                    </div>
                    <span class="quad-label">Hexagonal</span>
                </button>

                <!-- RazÃ³n Ãurea (Activa 100%) -->
                <button class="quad-item" data-type="golden" id="card-golden">
                    <div class="quad-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="5" width="18" height="14" rx="1"/>
                            <line x1="14" y1="5" x2="14" y2="19"/>
                            <line x1="14" y1="12" x2="21" y2="12"/>
                        </svg>
                    </div>
                    <span class="quad-label">Raz&oacute;n &Aacute;urea</span>
                </button>
            </div>

            <!-- 5. AcordeÃ³n Desplegable: Personalizar (100% Funcional) -->
            <div class="accordion-wrapper open" id="accordion-customize">
                <div class="accordion-header" id="btn-toggle-accordion">
                    <div class="accordion-title">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20h9"/>
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                        <span>Personalizar</span>
                    </div>
                    <span class="accordion-chevron">&#9656;</span>
                </div>

                <div class="accordion-body">
                    <!-- Slider de Espaciado -->
                    <div class="slider-row">
                        <div class="slider-labels">
                            <span>Espaciado / Paso (pt)</span>
                            <span class="slider-value" id="val-spacing">50.00</span>
                        </div>
                        <input type="range" class="range-slider" id="slider-spacing" min="10" max="250" value="50" step="5">
                    </div>

                    <!-- Columnas y Filas -->
                    <div class="form-grid-2" id="box-cols-rows">
                        <div class="input-box">
                            <label>Columnas</label>
                            <input type="number" id="input-cols" value="12" min="1" max="100">
                        </div>
                        <div class="input-box">
                            <label>Filas</label>
                            <input type="number" id="input-rows" value="12" min="1" max="100">
                        </div>
                    </div>

                    <!-- Ãrea de Destino -->
                    <div class="input-box">
                        <label>&Aacute;rea de Aplicaci&oacute;n</label>
                        <select id="select-scope">
                            <option value="artboard" selected>Mesa de Trabajo Activa</option>
                            <option value="selection">L&iacute;mites de Selecci&oacute;n</option>
                            <option value="custom">Matriz Centrada</option>
                        </select>
                    </div>

                    <!-- Opciones Toggles -->
                    <div class="toggle-row">
                        <span class="toggle-label">Diagonales a 45&deg;</span>
                        <label class="switch">
                            <input type="checkbox" id="toggle-diagonals">
                            <span class="switch-slider"></span>
                        </label>
                    </div>

                    <div class="toggle-row">
                        <span class="toggle-label">Reemplazar gu&iacute;as previas</span>
                        <label class="switch">
                            <input type="checkbox" id="toggle-clear-prev" checked>
                            <span class="switch-slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 6. Botones de AcciÃ³n (Make Guides & Generate - 100% Funcionales) -->
            <div class="card-actions">
                <button class="btn-make-guides" id="btn-make-guides">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 9h18M9 3v18"/>
                    </svg>
                    <span>Hacer Gu&iacute;as</span>
                </button>

                <button class="btn-generate" id="btn-generate">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/>
                    </svg>
                    <span>Generar</span>
                </button>
            </div>

            <!-- 7. Enlaces Inferiores de la Tarjeta: Reiniciar (Activo), Ayuda y Compartir al 20% -->
            <div class="card-footer-links">
                <button class="footer-link" id="btn-reset">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    <span>Reiniciar</span>
                </button>

                <button class="footer-link disabled-feature" data-functional="false" title="Pr&oacute;ximamente">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    <span>Ayuda</span>
                </button>

                <button class="footer-link disabled-feature" data-functional="false" title="Pr&oacute;ximamente">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="18" cy="5" r="3"/>
                        <circle cx="6" cy="12" r="3"/>
                        <circle cx="18" cy="19" r="3"/>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                    </svg>
                    <span>Compartir</span>
                </button>
            </div>
        </main>

        <!-- Barra de Estado Discreta -->
        <div class="status-pill" id="status-pill">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Listo. Documento conectado.</span>
        </div>

        <!-- Copyright / VersiÃ³n -->
        <footer class="app-copyright">
            <span>BITGRID PRO 26.1</span>
            <span>&copy; 2026 BitGrid Pro. Todos los derechos reservados.</span>
        </footer>
    </div>

    <script src="./js/CSInterface.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
